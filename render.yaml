services:
  - type: web
    name: concord
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile.hosted
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_SSL
        value: verify-full
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false

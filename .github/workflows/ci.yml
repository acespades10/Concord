name: Verify Concord
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: uv sync --project apps/api --extra dev --frozen
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm api:types && git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api-types.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: uv run --project apps/api --extra dev --frozen python benchmarks/prepare_dataset.py --check
      - run: pnpm benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotation-benchmark
          path: .local/benchmark/
          include-hidden-files: true
      - run: pnpm db:migrate
      - run: uv run --directory apps/api alembic downgrade base
      - run: pnpm db:migrate && pnpm db:seed
      - run: uv run --directory apps/api alembic check
      - run: pnpm build
      - run: pnpm --filter @concord/web exec playwright install --with-deps chromium
      - run: node site/scripts/check-browser.cjs
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            apps/web/playwright-report/
            apps/web/test-results/
            .local/site-qa/
          include-hidden-files: true
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: concord_test
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concord -d concord_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://concord:test-only@localhost:5432/concord_test
      TEST_DATABASE_URL: postgresql+asyncpg://concord:test-only@localhost:5432/concord_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --project apps/api --extra dev --frozen
      - run: uv run --directory apps/api alembic upgrade head
      - run: uv run --directory apps/api alembic check
      - run: uv run --directory apps/api alembic downgrade base
      - run: uv run --directory apps/api alembic upgrade head
      - run: uv run --directory apps/api pytest
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - run: docker compose up -d --wait web
      - run: curl --fail --retry 10 --retry-delay 5 http://localhost:3000/api/v1/health
      - run: docker compose logs
        if: always()
      - run: docker compose down -v
        if: always()
  production-image:
    runs-on: ubuntu-latest
    env:
      DOMAIN: localhost
      POSTGRES_PASSWORD: production-smoke-test-password-2026-only
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f compose.production.yaml config --quiet
      - run: docker run --rm -e DOMAIN=localhost -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -f deploy/Dockerfile.hosted -t concord-hosted .
      - run: docker network create concord-hosted-test
      - run: docker run -d --name hosted-db --network concord-hosted-test -e POSTGRES_USER=concord -e POSTGRES_DB=concord -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" --health-cmd="pg_isready -U concord -d concord" --health-interval=2s --health-retries=30 postgres:17-alpine
      - run: |
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' hosted-db)" = healthy ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: docker run -d --name hosted --network concord-hosted-test -p 127.0.0.1:10000:10000 -e APP_ORIGIN=https://localhost -e DATABASE_URL="postgresql+asyncpg://concord:$POSTGRES_PASSWORD@hosted-db/concord" concord-hosted
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10000/api/v1/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: printf 'hosted-test-password-2026\nhosted-test-password-2026\n' | docker exec -i hosted python -m app.accounts create --email owner@example.com --name Owner --role admin
      - run: python deploy/check-hosted.py
      - run: docker logs hosted
        if: always()
      - run: docker rm -f hosted hosted-db
        if: always()
      - run: docker network rm concord-hosted-test
        if: always()
